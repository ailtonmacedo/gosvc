name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make verify
      - run: go test -race ./...
      - name: Validate release metadata
        run: go run ./cmd/gosvc release check --version 1.0.0 --allow-placeholder
